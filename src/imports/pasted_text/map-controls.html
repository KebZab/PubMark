<!DOCTYPE html>
<html>
<head>
  <title>Test Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw/dist/leaflet.draw.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-rotate/dist/leaflet-rotate.css"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: 100vh; }
  </style>
</head>
<body>

<div id="map"></div>

<div id="coordinates" style="position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.7); color: #fff; padding: 8px 12px; border-radius: 4px; font-size: 12px; font-family: monospace; z-index: 1000;">
    <strong>Lat:</strong> <span id="lat">0.0000</span> | <strong>Lng:</strong> <span id="lng">0.0000</span>
    <div style="margin-top: 6px; font-size: 11px; opacity: 0.8;">
        <strong>Rotation:</strong> [ ] to rotate | R to reset
    </div>
</div>

<div class="sidebar">
    <div class="sidebar-header">Stall Information</div>
    <div class="sidebar-content" id="sidebarContent">
        <div class="sidebar-empty">
            <div>
                <div class="sidebar-empty-icon">📍</div>
                <div>Click on a stall to view its information</div>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-rotate/dist/leaflet-rotate.umd.js"></script>
<script src="https://unpkg.com/leaflet-draw/dist/leaflet.draw.js"></script>
<script>
var map = L.map('map', {
    maxZoom: 22,
    zoom: 18,
    rotate: true,
    bearing: 0
}).setView([10.6054, 123.0413], 18);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxNativeZoom: 19,
    maxZoom: 22
})
.addTo(map);

// Update coordinates display on mouse move
map.on('mousemove', function(e) {
    document.getElementById('lat').textContent = e.latlng.lat.toFixed(4);
    document.getElementById('lng').textContent = e.latlng.lng.toFixed(4);
});

// Keyboard controls for map rotation
document.addEventListener('keydown', function(e) {
    if (e.key === '[' || e.key === '{') {
        map.setBearing((map.getBearing() || 0) - 15);
    } else if (e.key === ']' || e.key === '}') {
        map.setBearing((map.getBearing() || 0) + 15);
    } else if (e.key === 'r' || e.key === 'R') {
        map.setBearing(0);
    }
});

// Layer group for stalls
var drawnItems = new L.FeatureGroup();
map.addLayer(drawnItems);

// Load existing stalls from database
function loadStalls() {
    fetch('load.php')
        .then(response => response.json())
        .then(features => {
            features.forEach(feature => {
                var layer = L.geoJSON(feature, {
                    onEachFeature: function(feature, layer) {
                        layer.stallData = feature.properties;
                        var type = feature.properties.type || 'other';
                        applyStallColor(layer, type);
                        updatePopup(layer);
                        drawnItems.addLayer(layer);
                    }
                });
            });
        })
        .catch(err => console.error('Load error:', err));
}

// Color mapping for stall types
var stallColors = {
    vegetables: '#28a745',
    meat: '#dc3545',
    seafood: '#007bff',
    fruits: '#ffc107',
    other: '#6c757d'
};

var stallTypes = ['vegetables', 'meat', 'seafood', 'fruits', 'other'];

// Draw controls
var drawControl = new L.Control.Draw({
    edit: {
        featureGroup: drawnItems
    },
    draw: {
        rectangle: {
            shapeOptions: {
                color: '#007bff',
                weight: 2,
                opacity: 0.8,
                fillColor: '#007bff',
                fillOpacity: 0.5,
                clickable: true
            }
        },
        polygon: {
            allowIntersection: false,
            drawError: {
                color: '#e1e100',
                message: '<strong>Oh snap!</strong> you can\'t draw that!'
            },
            shapeOptions: {
                color: '#007bff',
                weight: 2,
                opacity: 0.8,
                fillColor: '#007bff',
                fillOpacity: 0.5,
                clickable: true
            },
            showArea: true,
            metric: true,
            feet: false
        },
        polyline: {
            shapeOptions: {
                color: '#007bff',
                weight: 2,
                opacity: 0.8,
                fillColor: '#007bff',
                fillOpacity: 0.5,
                clickable: true
            },
            metric: true,
            feet: false
        },
        marker: false,
        circle: false,
        circlemarker: false
    }
});

map.addControl(drawControl);
map.on('draw:created', function (e) {
    var layer = e.layer;
    var type = e.layerType;

    // Convert polyline to closed polygon
    if (type === 'polyline') {
        var latlngs = layer.getLatLngs();
        // Close the polyline by connecting last point to first point
        if (latlngs.length > 0 && !latlngs[latlngs.length - 1].equals(latlngs[0])) {
            latlngs.push(latlngs[0]);
        }
        // Create a polygon instead
        var polygon = L.polygon(latlngs, {
            color: '#007bff',
            weight: 2,
            opacity: 0.8,
            fillColor: '#007bff',
            fillOpacity: 0.5,
            clickable: true
        });
        drawnItems.removeLayer(layer);
        drawnItems.addLayer(polygon);
        layer = polygon;
    } else {
        drawnItems.addLayer(layer);
    }

    // Add stall information
    var name = prompt("Enter stall name:");
    var info = prompt("Enter stall details/description:");
    
    var typeSelection = prompt("Select stall type:\n1. Vegetables\n2. Meat\n3. Seafood\n4. Fruits\n5. Other\n\nEnter number (1-5):", "5");
    var typeIndex = parseInt(typeSelection) - 1;
    var stallType = (typeIndex >= 0 && typeIndex < stallTypes.length) ? stallTypes[typeIndex] : 'other';

    var stallData = {
        name: name || "Unnamed Stall",
        info: info || "",
        type: stallType,
        created: new Date().toISOString()
    };

    layer.stallData = stallData;
    applyStallColor(layer, stallType);
    updatePopup(layer);
    displayStallInfo(layer);
    saveStallData(layer);
});

// Handle when stalls are edited
map.on('draw:edited', function(e) {
    e.layers.eachLayer(function(layer) {
        if (layer.stallData) {
            saveStallData(layer);
        }
    });
});

// Apply color to stall based on type
function applyStallColor(layer, type) {
    var color = stallColors[type] || stallColors.other;
    var options = {
        color: color,
        weight: 2,
        opacity: 0.8,
        fillColor: color,
        fillOpacity: 0.5
    };
    layer.setStyle(options);
}

// Update popup content for a layer
function updatePopup(layer) {
    var data = layer.stallData;
    layer.on('click', function() {
        displayStallInfo(layer);
    });
}

// Display stall info in sidebar
function displayStallInfo(layer) {
    var data = layer.stallData;
    var typeClass = 'type-' + (data.type || 'other');
    var typeLabel = (data.type || 'other').charAt(0).toUpperCase() + (data.type || 'other').slice(1);
    
    var stallHtml = `
        <div class="stall-info active">
            <div class="stall-name">${data.name}</div>
            <div class="stall-type ${typeClass}">${typeLabel}</div>
            <div class="stall-description">${data.info}</div>
            <div class="stall-actions">
                <button class="btn btn-primary" onclick="editStall(${layer._leaflet_id})">Edit Info</button>
                <button class="btn btn-secondary" onclick="deleteStall(${layer._leaflet_id})">Delete</button>
            </div>
        </div>
    `;
    
    var sidebarContent = document.getElementById('sidebarContent');
    sidebarContent.innerHTML = stallHtml;
    
    // Store reference to current layer
    window.currentLayer = layer;
}

// Edit stall information
function editStall(layerId) {
    var layer = window.currentLayer || drawnItems.getLayers().find(l => l._leaflet_id === layerId);
    
    if (!layer) return;
    
    var newName = prompt("Stall name:", layer.stallData.name);
    if (newName === null) return;
    
    var newInfo = prompt("Stall details:", layer.stallData.info);
    if (newInfo === null) return;
    
    var typeSelection = prompt("Select stall type:\n1. Vegetables\n2. Meat\n3. Seafood\n4. Fruits\n5. Other\n\nEnter number (1-5):", stallTypes.indexOf(layer.stallData.type) + 1);
    var typeIndex = parseInt(typeSelection) - 1;
    var newType = (typeIndex >= 0 && typeIndex < stallTypes.length) ? stallTypes[typeIndex] : layer.stallData.type;
    
    layer.stallData.name = newName;
    layer.stallData.info = newInfo;
    layer.stallData.type = newType;
    
    applyStallColor(layer, newType);
    displayStallInfo(layer);
    saveStallData(layer);
}

// Delete stall
function deleteStall(layerId) {
    if (!confirm("Are you sure you want to delete this stall?")) return;
    
    var layer = window.currentLayer || drawnItems.getLayers().find(l => l._leaflet_id === layerId);
    
    if (layer) {
        drawnItems.removeLayer(layer);
        
        // Clear sidebar
        document.getElementById('sidebarContent').innerHTML = `
            <div class="sidebar-empty">
                <div>
                    <div class="sidebar-empty-icon">📍</div>
                    <div>Click on a stall to view its information</div>
                </div>
            </div>
        `;
        
        window.currentLayer = null;
    }
}

// Save stall data to database
function saveStallData(layer) {
    var geoJson = layer.toGeoJSON();
    geoJson.properties = layer.stallData;
    
    console.log('Saving stall data:', geoJson);
    
    fetch('save.php', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(geoJson)
    })
    .then(response => {
        console.log('Response status:', response.status);
        return response.json();
    })
    .then(data => {
        console.log('Response data:', data);
        if (data.status === 'success') {
            console.log('Stall saved successfully:', data);
        } else {
            console.error('Save failed:', data.message);
            alert('Error: ' + data.message);
        }
    })
    .catch(err => {
        console.error('Fetch error:', err);
        alert('Error saving stall: ' + err.message);
    });
}

// Load existing stalls when page loads
loadStalls();
</script>

</body>
</html>
